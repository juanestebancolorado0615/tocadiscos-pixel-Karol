<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;background:#0d0418;user-select:none}
.room{position:absolute;inset:0;z-index:0}
.room svg{width:100%;height:100%}
.px{shape-rendering:crispEdges}
.glass-panel{background:rgba(22,9,38,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:2px solid rgba(255,89,143,.4)}

/* ---- Animaciones del cuarto ---- */
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blinkWin{0%,88%,100%{opacity:1}92%{opacity:.1}}
@keyframes lampFlicker{0%,100%{opacity:.9}47%{opacity:.8}50%{opacity:.95}53%{opacity:.78}}
@keyframes screenPulse{0%,100%{opacity:.35}50%{opacity:.6}}
@keyframes dust{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(24px,-70px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.star{animation:twinkle 3s ease-in-out infinite}
.winlight{animation:blinkWin 7s infinite}
.cone{animation:lampFlicker 5s ease-in-out infinite}
.glow{animation:screenPulse 2.8s ease-in-out infinite}
.mote{animation:dust 7s linear infinite;transform-box:fill-box}
.plant{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.lamp-swing{transform-box:view-box;transform-origin:380px 0;animation:sway 7s ease-in-out infinite}

/* ---- Tocadiscos ---- */
#tt{overflow:visible}
.spin{transform-box:fill-box;transform-origin:center;animation:spinVinyl 1.8s linear infinite;animation-play-state:paused}
.playing .spin{animation-play-state:running}
@keyframes spinVinyl{to{transform:rotate(360deg)}}
#tonearm{transform-origin:285px 122px;transform:rotate(-26deg);transition:transform .9s cubic-bezier(.34,1.4,.64,1)}
.playing #tonearm{transform:rotate(0deg);animation:needle 3.2s ease-in-out 1s infinite}
@keyframes needle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(.7deg)}}
#tt-body{transform-box:fill-box;transform-origin:50% 100%}
.playing #tt-body{animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,.994)}}
#lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s ease}
#vinyl-slide{transform-box:fill-box}
#sleeve{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s}
#sleeve:hover{transform:rotate(-3deg) translateY(-4px)}
.sleeve-wiggle{animation:wig .5s ease}
@keyframes wig{25%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(3deg)}100%{transform:none}}
.note{position:absolute;animation:floatNote 2.8s ease-out forwards;pointer-events:none;filter:drop-shadow(0 0 4px #FFD23F);color:#FFD23F}
@keyframes floatNote{0%{transform:translate(0,0) scale(.7) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),-110px) scale(1.4) rotate(var(--rot));opacity:0}}
.pop{animation:pop .35s cubic-bezier(.34,1.8,.64,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.eq span{display:inline-block;width:3px;background:#25C3B3;border-radius:1px;height:4px}
.playing-eq .eq span{animation:eq .7s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.15s!important}.eq span:nth-child(3){animation-delay:.3s!important}.eq span:nth-child(4){animation-delay:.45s!important}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;--v:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,#FF598F var(--v),#4a2a6e var(--v));border:1px solid rgba(255,255,255,.15)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFD23F;border:3px solid #FF2A75;margin-top:-6px;box-shadow:0 0 8px rgba(255,42,117,.7)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#4a2a6e}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:#FF598F}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FFD23F;border:3px solid #FF2A75}
.ctl{box-shadow:0 3px 0 #1a0b2e,0 0 12px rgba(255,89,143,.45)}
.ctl:active{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 #1a0b2e}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
.cat{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes zzz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.zzz{animation:zzz 3s ease-out infinite;transform-box:fill-box}
@keyframes petal{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:.95}50%{transform:translate(40px,320px) rotate(180deg)}100%{transform:translate(-20px,620px) rotate(360deg);opacity:0}}
.petal{animation:fall 14s linear infinite;transform-box:fill-box}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.3}}
.bulb{animation:bulb 2.2s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:1}55%{opacity:.4}}
.neon{animation:neon 4s infinite}
.flw{transform-box:fill-box;transform-origin:50% 100%;animation:petal 4.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:rgba(30,15,50,.8);border-radius:8px}::-webkit-scrollbar-thumb{background:#FF598F;border-radius:8px}
</style>

}

function setPlayingUI(on){isPlaying=on;tt.classList.toggle('playing',on);app.classList.toggle('playing-eq',on);$('play-icon').innerHTML=on?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M8 4l13 8-13 8z"/>';$('badge-status').textContent=on?'Sonando ♪':'En pausa';if(on)startNotes();else stopNotes();renderPlaylist();}
function loadSong(i){const s=playlist[i];if(!s)return;audio.pause();audio.src=s.src;audio.load();$('progress-bar').value=0;$('time-current').textContent='0:00';$('time-duration').textContent='0:00';fillRange($('progress-bar'));$('current-title').textContent=s.title;$('current-artist').textContent=s.artist;$('current-cover').src=s.cover;setLabel(s);renderPlaylist();}
async function playSong(){if(!playlist[cur])return;try{if(!audio.src||audio.src!==new URL(playlist[cur].src,document.baseURI).href){audio.src=playlist[cur].src;audio.load()}await audio.play();setPlayingUI(true);}catch(e){console.error('Error al reproducir:',e);setPlayingUI(false);$('badge-status').textContent='No se pudo cargar';}}
function pauseSong(){audio.pause();setPlayingUI(false)}
function togglePlay(){if(isPlaying||!audio.paused){pauseSong()}else{playSong()}}
async function switchSong(n,autoplay=false){if(!playlist[n])return;cur=n;loadSong(cur);if(vSlide){vSlide.classList.remove('pop');void vSlide.getBoundingClientRect();vSlide.classList.add('pop');}if(sleeve){sleeve.classList.remove('sleeve-wiggle');void sleeve.getBoundingClientRect();sleeve.classList.add('sleeve-wiggle')}if(autoplay)await playSong();else setPlayingUI(false);}
function nextSong(){switchSong((cur+1)%playlist.length,true)}function prevSong(){switchSong((cur-1+playlist.length)%playlist.length,true)}
function startNotes(){stopNotes();noteTimer=setInterval(()=>{const n=document.createElement('div');n.className='note text-lg';n.style.left=Math.random()*70+'px';n.style.setProperty('--dx',(Math.random()*60-20)+'px');n.style.setProperty('--rot',(Math.random()*50-25)+'deg');n.textContent=['♪','♫','♬','★','✦'][Math.floor(Math.random()*5)];$('notes-container').appendChild(n);setTimeout(()=>n.remove(),2800)},650)}function stopNotes(){clearInterval(noteTimer);noteTimer=null;$('notes-container').innerHTML=''}

$('play-btn').addEventListener('click',e=>{e.preventDefault();togglePlay()});$('prev-btn').addEventListener('click',e=>{e.preventDefault();prevSong()});$('next-btn').addEventListener('click',e=>{e.preventDefault();nextSong()});if(vSlide)vSlide.addEventListener('click',togglePlay);if(sleeve)sleeve.addEventListener('click',nextSong);

audio.addEventListener('play',()=>setPlayingUI(true));audio.addEventListener('pause',()=>{if(!audio.ended)setPlayingUI(false)});audio.addEventListener('ended',()=>{nextSong()});audio.addEventListener('timeupdate',()=>{if(Number.isFinite(audio.duration)){ $('progress-bar').value=audio.currentTime/audio.duration*100;fillRange($('progress-bar'));$('time-current').textContent=fmt(audio.currentTime);$('time-duration').textContent=fmt(audio.duration)}});audio.addEventListener('loadedmetadata',()=>{$('time-duration').textContent=Number.isFinite(audio.duration)?fmt(audio.duration):'0:00'});$('progress-bar').addEventListener('input',e=>{fillRange(e.target);if(Number.isFinite(audio.duration))audio.currentTime=Number(e.target.value)/100*audio.duration});$('volume-control').addEventListener('input',e=>{audio.volume=Number(e.target.value);fillRange(e.target)});fillRange($('volume-control'));fillRange($('progress-bar'));audio.volume=Number($('volume-control').value)||0.8;

renderPlaylist();loadSong(cur);
</script>
</body>
